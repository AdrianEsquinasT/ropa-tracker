<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lefties tracker</title>
<style>
:root{--bg:#f6f6f4;--fg:#1c1c1c;--card:#fff;--mut:#6b6b6b;--ok:#1a7f37;--bad:#b42318;--acc:#111}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--card:#1e1e1e;--mut:#9a9a9a;--ok:#4ade80;--bad:#f87171;--acc:#eee}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;padding:0 16px 120px}
h1{font-size:20px;margin:16px 0 4px}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border-radius:12px;padding:12px;display:flex;gap:12px;position:relative}
.img{width:90px;height:120px;border-radius:8px;background:#8883;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut);text-align:center}
.b{flex:1;min-width:0}.name{font-weight:600;overflow-wrap:anywhere}.art{color:var(--mut);font-size:12px}
.price{font-size:20px;font-weight:700;margin:4px 0}.tag{font-size:12px;padding:2px 8px;border-radius:99px;display:inline-block;margin:2px 4px 2px 0;background:#8882}
.ok{color:var(--ok)}.bad{color:var(--bad)}a{color:inherit}.chk{position:absolute;top:10px;right:12px;width:22px;height:22px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);padding:12px 16px;border-top:1px solid #8884;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar b{font-size:18px}button{background:var(--acc);color:var(--bg);border:0;border-radius:8px;padding:10px 14px;font:inherit}
</style></head><body>
<h1>Lefties tracker</h1><div class="sub" id="upd"></div>
<div class="grid" id="g"></div>
<div class="bar"><div><span id="n">0</span> prendas · <b id="t">0,00 €</b></div><button id="clr">Vaciar</button></div>
<script>
const KEY="lefties_cart",fmt=n=>n.toFixed(2).replace(".",",")+" €";
let cart;try{cart=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){cart=new Set()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...cart]))}catch(e){}};
let items=[];
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function safeUrl(u){return /^https?:\/\//.test(u||"")?u:""}
function render(){
  const g=document.getElementById("g");g.innerHTML="";
  items.forEach(it=>{
    const h=it.history,first=h[0].price,max=Math.max(...h.map(x=>x.price)),d=it.price-max;
    let size="<span class='tag'>talla: sin datos</span>";
    if(it.in_my_size)size=it.in_my_size.length?`<span class='tag ok'>✔ tu talla: ${esc(it.in_my_size.join(", "))}</span>`:`<span class='tag bad'>✘ tu talla agotada</span>`;
    const img=it.image?`<img class="img" src="${esc(safeUrl(it.image))}" alt="" loading="lazy">`:`<div class="img">${esc(it.art)}</div>`;
    const url=safeUrl(it.url);
    const c=document.createElement("div");c.className="card";
    c.innerHTML=`${img}<div class="b"><div class="name">${esc(it.name)}</div><div class="art">${esc(it.art)} · ${esc(it.store)}</div>
    <div class="price">${fmt(it.price)} ${d<0?`<small class='ok'>${fmt(d)}</small>`:""}</div>
    ${size}<span class="tag">busco: ${esc(it.wanted.join("/"))}</span>
    <div class="art">${url?`<a href="${esc(url)}" target="_blank" rel="noopener">Ver en Lefties</a>`:"sin URL"} · ${esc(it.status==="ok"?"ok":"⚠ "+it.status)}</div></div>
    <input class="chk" type="checkbox" ${cart.has(it.art)?"checked":""}>`;
    c.querySelector(".chk").onchange=e=>{e.target.checked?cart.add(it.art):cart.delete(it.art);save();total()};
    g.appendChild(c)});
  total()}
function total(){const s=items.filter(i=>cart.has(i.art));
  document.getElementById("n").textContent=s.length;
  document.getElementById("t").textContent=fmt(s.reduce((a,i)=>a+i.price,0))}
document.getElementById("clr").onclick=()=>{cart.clear();save();render()};
fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{items=d.items;
  document.getElementById("upd").textContent="Actualizado: "+new Date(d.updated).toLocaleString("es-ES");render()})
 .catch(()=>document.getElementById("upd").textContent="No se pudo cargar data.json");
</script></body></html>
